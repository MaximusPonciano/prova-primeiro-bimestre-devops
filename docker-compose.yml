services:
  db:
    image: postgres:15-alpine
    container_name: reservas_db
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASS:-adminpassword}
      POSTGRES_DB: ${DB_NAME:-reservas_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-reservas_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: 
      context: ./app
      dockerfile: Dockerfile
    container_name: reservas_api
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-admin}
      - DB_PASS=${DB_PASS:-adminpassword}
      - DB_NAME=${DB_NAME:-reservas_db}
      - DATABASE_URL=postgres://${DB_USER:-admin}:${DB_PASS:-adminpassword}@db:5432/${DB_NAME:-reservas_db}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
